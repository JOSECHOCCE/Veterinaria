name: VetCare Pro - CI/CD pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-backend:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore src/Backend/Veterinaria.sln

    - name: Run Unit Tests
      run: dotnet test src/Backend/Veterinaria.sln --no-restore --filter "FullyQualifiedName!~Integration"

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: src/Frontend/package-lock.json

    - name: Install Dependencies
      run: |
        cd src/Frontend
        npm install

    - name: Build Frontend
      run: |
        cd src/Frontend
        npm run build

    - name: Upload Compiled Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-assets
        path: src/Backend/Veterinaria.Web/wwwroot/

  deploy-to-aws:
    name: Build Docker & Push to Amazon ECR
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Compiled Frontend Artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-assets
        path: src/Backend/Veterinaria.Web/wwwroot

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, Tag, and Push Docker Image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY_NAME }}
        IMAGE_TAG: latest
      run: |
        cd src/Backend
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Trigger AWS App Runner Deployment (Fallback if auto-deploy is disabled)
      run: |
        aws apprunner start-deployment --service-arn ${{ secrets.AWS_APP_RUNNER_SERVICE_ARN }} || echo "App Runner Auto-deploy was likely triggered already."
