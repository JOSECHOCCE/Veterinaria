project: Veterinaria
stack:
  backend: C# .NET 10 (Clean Architecture - Web, Infrastructure, Application, Domain)
  frontend: React 19, TypeScript, Vite, TailwindCSS v4
  database: PostgreSQL / SQL Server (Dockerized)
strict_tdd: true
testing:
  backend:
    command: dotnet test
    framework: xUnit
    unit: true
    integration: true
  frontend:
    command: npm run dev / npx playwright test
    framework: Playwright
    linter: npm run lint
    typechecker: npx tsc -b
    e2e: true
persistence:
  mode: hybrid
