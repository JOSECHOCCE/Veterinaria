<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VetCare Pro - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error-container": "#ffdad6",
                    "tertiary-fixed": "#ffdcbe",
                    "surface-container-high": "#d5ecf8",
                    "background": "#f3faff",
                    "inverse-surface": "#1e333c",
                    "on-surface": "#071e27",
                    "on-tertiary-container": "#ffc388",
                    "on-secondary-fixed": "#002204",
                    "primary-fixed": "#d9e2ff",
                    "on-primary-fixed-variant": "#00419c",
                    "error": "#ba1a1a",
                    "on-tertiary": "#ffffff",
                    "outline": "#737784",
                    "surface-tint": "#1d59c1",
                    "on-primary-container": "#bcceff",
                    "on-secondary-container": "#00731e",
                    "secondary-container": "#91f78e",
                    "surface-container": "#dbf1fe",
                    "on-secondary-fixed-variant": "#005313",
                    "on-tertiary-fixed-variant": "#693c00",
                    "surface-dim": "#c7dde9",
                    "surface-container-low": "#e6f6ff",
                    "primary": "#003c90",
                    "on-tertiary-fixed": "#2c1600",
                    "on-primary-fixed": "#001945",
                    "tertiary": "#613600",
                    "on-background": "#071e27",
                    "surface-container-lowest": "#ffffff",
                    "inverse-primary": "#b0c6ff",
                    "secondary-fixed": "#94f990",
                    "surface-variant": "#cfe6f2",
                    "inverse-on-surface": "#dff4ff",
                    "primary-container": "#0f52ba",
                    "on-surface-variant": "#434653",
                    "on-error": "#ffffff",
                    "secondary-fixed-dim": "#78dc77",
                    "secondary": "#006e1c",
                    "tertiary-fixed-dim": "#ffb870",
                    "on-secondary": "#ffffff",
                    "tertiary-container": "#814b00",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#b0c6ff",
                    "surface": "#f3faff",
                    "on-error-container": "#93000a",
                    "outline-variant": "#c3c6d5",
                    "surface-container-highest": "#cfe6f2",
                    "surface-bright": "#f3faff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "sm": "12px",
                    "xs": "4px",
                    "md": "24px",
                    "margin": "32px",
                    "base": "8px",
                    "xl": "64px",
                    "gutter": "24px",
                    "lg": "40px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-xl": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                    "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        .clinical-glow:focus-within {
            box-shadow: 0 0 0 2px rgba(0, 60, 144, 0.2);
            border-color: #003c90;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-gutter">
<!-- Login Container -->
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-lg flex flex-col gap-lg">
<!-- Header / Branding -->
<header class="flex flex-col items-center gap-sm text-center">
<div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center text-primary mb-xs">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface">VetCare Pro</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Acceso al sistema de gestión clínica</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-md">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative clinical-glow rounded-lg transition-colors duration-200">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-12 pl-10 pr-sm bg-transparent border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-0" id="email" name="email" placeholder="doctor@vetcare.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">¿Olvidó su contraseña?</a>
</div>
<div class="relative clinical-glow rounded-lg transition-colors duration-200">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-12 pl-10 pr-sm bg-transparent border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-0" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 mt-xs bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-xs transition-colors shadow-sm" type="submit">
<span>Ingresar al Sistema</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Info -->
<div class="text-center mt-sm">
<p class="font-label-sm text-label-sm text-outline-variant">Uso exclusivo para personal autorizado.</p>
</div>
</main>
</body></html>
