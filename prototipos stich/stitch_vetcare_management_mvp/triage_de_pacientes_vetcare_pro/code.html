<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                      "error-container": "#ffdad6",

                      "surface-container-low": "#e6f6ff",
                      "surface-container": "#dbf1fe",
                      "primary-fixed": "#d9e2ff",
                      "secondary-fixed-dim": "#78dc77",
                      "primary-fixed-dim": "#b0c6ff",
                      "inverse-on-surface": "#dff4ff",
                      "primary-container": "#0f52ba",
                      "tertiary": "#613600",
                      "on-primary-fixed": "#001945",
                      "surface-variant": "#cfe6f2",
                      "outline-variant": "#c3c6d5",
                      "on-primary": "#ffffff",
                      "on-background": "#071e27",
                      "on-tertiary-fixed": "#2c1600",
                      "on-primary-container": "#bcceff",
                      "inverse-surface": "#1e333c",

                      "surface-tint": "#1d59c1",
                      "on-secondary-container": "#00731e",

                      "on-surface-variant": "#434653",

              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "md": "24px",
                      "xs": "4px",
                      "sm": "12px",
                      "gutter": "24px",
                      "margin": "32px",
                      "base": "8px",
                      "xl": "64px",
                      "lg": "40px"
              },
              "fontFamily": {
                      "label-sm": [
                              "Inter"
                      ],
                      "body-md": [

                      ],

                      ],

              },
              "fontSize": {

                                      "fontWeight": "400"

                      "headline-lg": [

              }
      },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Task-Focused Header -->
<header class="bg-surface-container-lowest border-b border-outline-variant px-gutter h-16 flex items-center justify-between sticky top-0 z-30">
<div class="flex items-center gap-sm">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-[48px] h-[48px] rounded-full hover:bg-surface-variant" type="button">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Triage de Paciente</h1>
</div>
<div class="text-right">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Protocolo Clínico</p>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow p-margin max-w-2xl mx-auto w-full">
<form class="flex flex-col gap-margin">
<!-- Section: Identificación del Paciente -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md shadow-sm">
<div class="flex items-center gap-sm mb-md pb-sm border-b border-surface-variant">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">pets</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Identificación del Paciente</h2>
</div>
<div class="flex flex-col gap-sm">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="petName">Nombre del Paciente</label>
<input class="h-[48px] bg-surface-bright border border-outline text-on-surface rounded-DEFAULT px-sm font-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="petName" placeholder="Ej. Max, Luna..." type="text"/>
</div>
<div class="flex flex-col gap-xs mt-sm">
<label class="font-label-md text-label-md text-on-surface" for="species">Especie</label>
<div class="relative">
<select class="appearance-none w-full h-[48px] bg-surface-bright border border-outline text-on-surface rounded-DEFAULT px-sm pr-10 font-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="species">
<option disabled="" selected="" value="">Seleccione la especie</option>
<option value="canino">Canino</option>
<option value="felino">Felino</option>
<option value="exotico">Exótico / Otros</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
</section>
<!-- Section: Signos Vitales -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md shadow-sm">
<div class="flex items-center gap-sm mb-md pb-sm border-b border-surface-variant">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">monitor_heart</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Signos Vitales</h2>
</div>
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="temp">Temperatura (°C)</label>
<input class="h-[48px] bg-surface-bright border border-outline text-on-surface rounded-DEFAULT px-sm font-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="temp" placeholder="Ej. 38.5" step="0.1" type="number"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="hr">Frecuencia Cardíaca (LPM)</label>
<input class="h-[48px] bg-surface-bright border border-outline text-on-surface rounded-DEFAULT px-sm font-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="hr" placeholder="Ej. 120" type="number"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="weight">Peso Estimado (KG)</label>
<input class="h-[48px] bg-surface-bright border border-outline text-on-surface rounded-DEFAULT px-sm font-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="weight" placeholder="Ej. 15.2" step="0.1" type="number"/>
</div>
</div>
</section>
<!-- Section: Motivo de Consulta -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md shadow-sm">
<div class="flex items-center gap-sm mb-md pb-sm border-b border-surface-variant">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">assignment</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Motivo de Consulta</h2>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface sr-only" for="reason">Descripción del motivo</label>
<textarea class="bg-surface-bright border border-outline text-on-surface rounded-DEFAULT p-sm font-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow resize-y" id="reason" placeholder="Describa brevemente los síntomas o motivo de llegada del paciente..." rows="4"></textarea>
</div>
</section>
<!-- Section: Nivel de Prioridad -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md shadow-sm">
<div class="flex items-center gap-sm mb-md pb-sm border-b border-surface-variant">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">emergency</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Clasificación de Prioridad</h2>
</div>
<div class="flex flex-col gap-sm">
<!-- Nivel 1: Emergencia -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="priority" type="radio" value="level1"/>
<div class="flex flex-col p-sm border border-outline-variant rounded-xl bg-surface-bright hover:bg-surface-container transition-colors peer-checked:border-error peer-checked:bg-error-container peer-checked:ring-1 peer-checked:ring-error">
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="w-4 h-4 rounded-full border-2 border-outline peer-checked:border-error peer-checked:bg-error flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-surface-container-lowest hidden peer-checked:block"></div>
</div>
<span class="font-headline-md text-headline-md text-error">Nivel 1: Emergencia</span>
</div>
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<p class="mt-xs text-body-md text-on-surface-variant ml-[28px]">Riesgo vital inminente. Requiere atención médica inmediata (Ej: Paro cardiorrespiratorio, hemorragia masiva).</p>
</div>
</label>
<!-- Nivel 2: Urgente -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="priority" type="radio" value="level2"/>
<div class="flex flex-col p-sm border border-outline-variant rounded-xl bg-surface-bright hover:bg-surface-container transition-colors peer-checked:border-tertiary-fixed-dim peer-checked:bg-tertiary-fixed peer-checked:ring-1 peer-checked:ring-tertiary-fixed-dim">
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="w-4 h-4 rounded-full border-2 border-outline flex items-center justify-center">
<div class="w-2 h-2 rounded-full hidden"></div>
</div>
<span class="font-headline-md text-headline-md text-on-tertiary-fixed-variant">Nivel 2: Urgente</span>
</div>
<span class="material-symbols-outlined text-on-tertiary-fixed-variant" style="font-variation-settings: 'FILL' 1;">timer</span>
</div>
<p class="mt-xs text-body-md text-on-surface-variant ml-[28px]">Condición grave, pero estable por el momento. Atención a la brevedad (Ej: Fracturas abiertas, dolor agudo severo).</p>
</div>
</label>
<!-- Nivel 3: No Urgente -->
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="priority" type="radio" value="level3"/>
<div class="flex flex-col p-sm border border-outline-variant rounded-xl bg-surface-bright hover:bg-surface-container transition-colors peer-checked:border-secondary peer-checked:bg-secondary-container peer-checked:ring-1 peer-checked:ring-secondary">
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="w-4 h-4 rounded-full border-2 border-outline peer-checked:border-secondary peer-checked:bg-secondary flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-surface-container-lowest hidden peer-checked:block"></div>
</div>
<span class="font-headline-md text-headline-md text-on-secondary-container">Nivel 3: No Urgente</span>
</div>
<span class="material-symbols-outlined text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<p class="mt-xs text-body-md text-on-surface-variant ml-[28px]">Estable, sin riesgo vital. Puede esperar su turno (Ej: Vacunaciones, problemas dermatológicos leves).</p>
</div>
</label>
</div>
</section>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-sm pt-sm mt-md border-t border-surface-variant">
<button class="h-[48px] px-lg rounded-full font-label-md text-label-md text-primary border border-outline hover:bg-surface-container-low transition-colors w-full sm:w-auto" type="button">
                    Cancelar
                </button>
<button class="h-[48px] px-lg rounded-full font-label-md text-label-md bg-primary text-on-primary hover:bg-surface-tint transition-colors shadow-sm flex items-center justify-center gap-xs w-full sm:w-auto sm:ml-auto" type="button">
<span class="material-symbols-outlined text-[20px]">send</span>
                    Enviar a Cola de Atención
                </button>
</div>
</form>
</main>
</body></html>
