<script>
        // Simple JS for visual interaction on time blocks
        document.addEventListener('DOMContentLoaded', () => {
            const timeButtons = document.querySelectorAll('.grid-cols-3 button:not([disabled])');
            
            timeButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Reset all
                    timeButtons.forEach(btn => {
                        btn.className = 'py-xs text-center border border-hairline rounded-md bg-canvas font-body-sm text-body-sm text-secondary hover:border-primary hover:text-primary transition-colors';
                    });
                    
                    // Set active
                    this.className = 'py-xs text-center border border-primary bg-surface-container-low rounded-md font-body-sm text-body-sm text-primary font-medium transition-colors';
                });
            });

            // Mock predictive search input
            const searchInput = document.getElementById('patient-search');
            searchInput.addEventListener('focus', () => {
                searchInput.classList.add('rounded-b-none', 'border-b-transparent');
                // Normally we'd show results here, but for static design it's hidden.
            });
            searchInput.addEventListener('blur', () => {
                searchInput.classList.remove('rounded-b-none', 'border-b-transparent');
            });
        });
    </script>
