<div class="w-full max-w-md flex flex-col gap-xl">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-coral" style="font-variation-settings: 'FILL' 1; font-size: 32px;">pets</span>
<span class="font-display-sm text-display-sm text-ink tracking-tight">VetCare <span class="text-coral font-bold italic">Pro</span></span>
</div>
<div class="flex flex-col gap-sm">
<h1 class="font-display-md text-display-md text-ink">Iniciar sesión</h1>
<p class="font-body-md text-body-md text-body-muted">Bienvenido de nuevo a VetCare Pro. Por favor, introduzca sus credenciales para acceder al sistema.</p>
</div>
<form action="#" class="flex flex-col gap-lg w-full mt-sm" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-title-sm text-title-sm text-ink" for="email">Correo electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-body-muted text-[20px]">mail</span>
<input class="w-full pl-xxl pr-sm py-sm bg-canvas border border-hairline rounded focus:border-coral focus:ring-1 focus:ring-coral transition-colors font-body-md text-body-md text-ink placeholder:text-body-muted" id="email" name="email" placeholder="doctor@vetcarepro.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-title-sm text-title-sm text-ink" for="password">Contraseña</label>
<a class="font-caption text-caption text-coral hover:text-surface-tint transition-colors" href="#">¿Olvidó su contraseña?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-body-muted text-[20px]">lock</span>
<input class="w-full pl-xxl pr-sm py-sm bg-canvas border border-hairline rounded focus:border-coral focus:ring-1 focus:ring-coral transition-colors font-body-md text-body-md text-ink placeholder:text-body-muted" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center gap-sm mt-xs">
<input class="w-4 h-4 text-coral bg-canvas border-hairline rounded focus:ring-coral" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-body-muted cursor-pointer" for="remember">Mantener sesión iniciada</label>
</div>
<button class="w-full py-md px-lg bg-coral text-on-primary font-button text-button rounded hover:bg-surface-tint transition-colors flex justify-center items-center gap-sm mt-md" type="submit">
                        Iniciar sesión
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="flex flex-col items-center gap-md mt-lg border-t border-hairline pt-xl">
<p class="font-body-sm text-body-sm text-body-muted">
                        ¿No tiene una cuenta para su clínica?
                    </p>
<a class="font-button text-button text-ink border border-ink py-sm px-lg rounded hover:bg-surface-soft transition-colors w-full text-center" href="#">

                    </a>
