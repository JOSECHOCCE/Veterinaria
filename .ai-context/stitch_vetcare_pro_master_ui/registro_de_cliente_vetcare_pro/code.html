<body class="bg-canvas text-on-surface antialiased font-body-md selection:bg-primary/20 selection:text-primary">
<!-- Registration Layout: 50/50 Split -->
<div class="min-h-screen flex flex-col lg:flex-row w-full">
<!-- Left Side: Form Canvas -->
<main class="flex-1 flex flex-col justify-center px-gutter py-section lg:px-section max-w-3xl mx-auto w-full lg:w-1/2 relative z-10">
<!-- Brand / Back Navigation -->
<div class="absolute top-margin left-gutter lg:left-section">
<a class="inline-flex items-center gap-xs text-body-muted hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[20px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="font-nav-link text-nav-link">Volver al Login</span>
</a>
</div>
<!-- Form Container -->
<div class="w-full max-w-md mx-auto mt-xxl lg:mt-0">
<div class="mb-xl text-center lg:text-left">
<!-- Brand Anchor -->
<div class="mb-lg inline-flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-[32px] font-light">pets</span>
<span class="font-display-sm text-display-sm font-bold tracking-tight text-ink">VetCare Pro</span>
</div>
<h1 class="font-display-md text-display-md text-ink mb-sm">Crea tu cuenta</h1>
<p class="font-body-md text-body-md text-body-muted">Ingresa tus datos para comenzar a gestionar el bienestar de tus pacientes con excelencia clínica.</p>
</div>
<form action="#" class="space-y-md" method="POST">
<!-- Full Name -->
<div>
<label class="block font-title-sm text-title-sm text-ink mb-xs" for="nombre">Nombre completo</label>
<input class="w-full bg-canvas border border-hairline rounded-DEFAULT px-md py-sm font-body-md text-body-md text-ink placeholder:text-body-muted/50 focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="nombre" name="nombre" placeholder="Ej. Dra. Elena Silva" required="" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block font-title-sm text-title-sm text-ink mb-xs" for="email">Correo electrónico</label>
<input class="w-full bg-canvas border border-hairline rounded-DEFAULT px-md py-sm font-body-md text-body-md text-ink placeholder:text-body-muted/50 focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="elena@clinicaveterinaria.com" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block font-title-sm text-title-sm text-ink mb-xs" for="password">Contraseña</label>
<div class="relative">
<input class="w-full bg-canvas border border-hairline rounded-DEFAULT px-md py-sm pr-10 font-body-md text-body-md text-ink placeholder:text-body-muted/50 focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-sm text-body-muted hover:text-ink" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Phone -->
<div>
<label class="block font-title-sm text-title-sm text-ink mb-xs" for="telefono">Teléfono</label>
<input class="w-full bg-canvas border border-hairline rounded-DEFAULT px-md py-sm font-body-md text-body-md text-ink placeholder:text-body-muted/50 focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="telefono" name="telefono" placeholder="+34 600 000 000" required="" type="tel"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md pt-xs">
<!-- Optional ID -->
<div>
<label class="block font-title-sm text-title-sm text-ink mb-xs flex items-center justify-between" for="documento">
                                Documento de identidad
                                <span class="font-caption text-caption text-body-muted font-normal">(Opcional)</span>
</label>
<input class="w-full bg-canvas border border-hairline rounded-DEFAULT px-md py-sm font-body-md text-body-md text-ink placeholder:text-body-muted/50 focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="documento" name="documento" type="text"/>
</div>
<!-- Optional Address -->
<div>
<label class="block font-title-sm text-title-sm text-ink mb-xs flex items-center justify-between" for="direccion">
                                Dirección
                                <span class="font-caption text-caption text-body-muted font-normal">(Opcional)</span>
</label>
<input class="w-full bg-canvas border border-hairline rounded-DEFAULT px-md py-sm font-body-md text-body-md text-ink placeholder:text-body-muted/50 focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="direccion" name="direccion" type="text"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm pt-sm pb-md">
<div class="flex items-center h-5 mt-1">
<input class="h-4 w-4 rounded-sm border-hairline text-primary focus:ring-primary bg-canvas cursor-pointer" id="terms" name="terms" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-body-muted cursor-pointer" for="terms">
                            He leído y acepto la <a class="text-ink underline decoration-hairline hover:decoration-primary transition-all" href="#">Política de Privacidad</a> y los <a class="text-ink underline decoration-hairline hover:decoration-primary transition-all" href="#">Términos de Servicio</a>.
                        </label>
</div>
<!-- Submit Action -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-button text-button py-sm px-lg rounded-DEFAULT transition-colors duration-200 shadow-sm flex items-center justify-center gap-sm group" type="submit">
                        Registrarse
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</div>
</main>
<!-- Right Side: Editorial Image -->
<aside class="hidden lg:block lg:w-1/2 relative bg-surface-dark overflow-hidden">
<!-- Warm overlay to match canvas slightly -->
<div class="absolute inset-0 bg-surface-tint/10 mix-blend-multiply z-10 pointer-events-none"></div>
<img alt="" class="absolute inset-0 w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTCLSv-cpXo2R43qQ6AI9XXsXWH-RGzGv9B5MJvu305-mySiGG5dQnERZcCMgByeFSf6dG3T7U7OI0c4lu5SB9pRjEq2a2Ej89c-kE8C4oT-9PbYuJIA1XaCm2-Yp2ZyBldfyPb2R0PQB17SICLmBMw5SYs0NEYCVT9BT9SF0_0YwGL0ObANSVjC_MNg6Q-I6GD99ANXSBXG_XKKgoWlTNd7CPkAMapFssLoch8fZ1_1sMtipy9sR9ihNhvIg62sQulYCouxZcpJY"/>
<!-- Minimalist caption overlay -->
<div class="absolute bottom-margin right-margin z-20 max-w-sm bg-canvas/90 backdrop-blur-md p-lg rounded-lg border border-hairline/50 shadow-sm">
<div class="flex items-center gap-xs mb-xs text-primary">
<span class="material-symbols-outlined text-[20px]">medical_services</span>
<span class="font-caption-uppercase text-caption-uppercase">Excelencia Clínica</span>
</div>
<p class="font-body-sm text-body-sm text-ink">Únete a la red de profesionales dedicados al cuidado animal con herramientas de precisión y empatía.</p>
</div>
</aside>
</div>
</body></html>
