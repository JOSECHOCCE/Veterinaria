version: '3.8'

services:
  # Base de Datos (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: vetcare-db
    restart: always
    environment:
      POSTGRES_DB: vetcare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: VetCareProductionPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vetcare_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vetcare-network

  # Backend Web API (.NET 10)
  backend:
    build:
      context: ./src/Backend
      dockerfile: Dockerfile
    container_name: vetcare-backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__VeterinariaDb=Host=db;Database=vetcare_db;Username=postgres;Password=VetCareProductionPassword2026!
      - Jwt__Key=ProductionSecretKey_ForVetCareSaaS_MinLength32Chars!
      - Jwt__Issuer=https://vetcarepro.pe
      - Jwt__Audience=https://vetcarepro.pe
    ports:
      - "8080:8080"
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/swagger || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - vetcare-network

  # Frontend Web Client (React SPA + Nginx Alpine)
  frontend:
    build:
      context: ./src/Frontend
      dockerfile: Dockerfile
    container_name: vetcare-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - vetcare-network

volumes:
  postgres_data:
    driver: local

networks:
  vetcare-network:
    driver: bridge
